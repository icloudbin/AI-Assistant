<!-- sidepanel/mic-permission.html —— Opened as a full tab (not inside the side
     panel) purely to request microphone permission. Chromium side panels have
     a known issue where the getUserMedia permission prompt can fail to show
     ("permission dismissed"); a normal tab does not have that problem. This
     tab closes itself automatically once permission is granted. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microphone Permission — AI Assistant</title>
  <link rel="stylesheet" href="mic-permission.css" />
</head>
<body>
  <div class="card">
    <div class="icon">🎤</div>
    <h1>Allow microphone access</h1>
    <p>AI Assistant needs microphone access for voice input in the side panel. Click below and choose <strong>Allow</strong> in the browser's prompt. This tab closes itself once access is granted.</p>
    <button id="requestBtn" type="button">Allow microphone</button>
    <div class="state" id="state" aria-live="polite"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
